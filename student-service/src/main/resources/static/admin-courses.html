<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Admin Portal | Courses</title><link rel="stylesheet" href="styles.css" /></head>
<body>
<header id="appHeader" class="app-header"></header>
<section class="page-hero"><p class="eyebrow">Admin</p><h1>Manage Courses</h1><p class="subtitle">Add new courses for students to enrol in. Each enrolment will create a Finance invoice using the course price.</p></section>
<main class="dashboard-grid">
    <section class="card"><h2>Add course</h2><form id="courseForm"><label>Course title <input name="title" required /></label><label>Price (£) <input name="price" type="number" min="0" step="0.01" required /></label><button class="primary" type="submit">Add course</button></form><div id="statusBanner" class="status">Ready.</div></section>
    <section class="card"><h2>Current courses</h2><div class="table-wrap"><table><thead><tr><th>ID</th><th>Title</th><th>Price</th><th>Action</th></tr></thead><tbody id="coursesTable"><tr><td colspan="4">Loading...</td></tr></tbody></table></div></section>
</main>
<script src="portal.js"></script><script src="admin-courses.js"></script>
</body></html>
