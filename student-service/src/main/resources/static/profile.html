<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Student Portal | Profile Edit</title><link rel="stylesheet" href="styles.css" /></head>
<body>
<header id="appHeader" class="app-header"></header>
<section class="page-hero"><p class="eyebrow">Profile</p><h1>View / Update Student Profile</h1><p class="subtitle">Your student ID is shown here. You can update your first name and surname.</p></section>
<main class="dashboard-grid">
    <section class="card"><h2>Current profile</h2><div id="profileResult" class="result muted">Loading profile...</div><div id="statusBanner" class="status">Ready.</div></section>
    <section class="card"><h2>Edit profile</h2><form id="profileForm"><label>First name <input name="firstName" required /></label><label>Last name <input name="lastName" required /></label><button class="primary" type="submit">Save profile</button></form></section>
</main>
<script src="portal.js"></script><script src="profile.js"></script>
</body></html>
